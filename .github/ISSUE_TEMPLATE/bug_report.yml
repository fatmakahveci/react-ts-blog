name: Bug report
description: Report a reproducible problem.
labels: []
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow our [security policy](https://github.com/fatmakahveci/react-ts-blog/blob/main/.github/SECURITY.md)."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page URL and a minimal example if possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, and commit or release.
    validations:
      required: true
